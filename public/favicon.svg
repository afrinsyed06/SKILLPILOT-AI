<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0B132B" />
      <stop offset="50%" stopColor="#1C2541" />
      <stop offset="100%" stopColor="#0A1128" />
    </linearGradient>
    <linearGradient id="wing-l" x1="12" y1="10" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="65%" stopColor="#0284C7" />
      <stop offset="100%" stopColor="#1E3A8A" />
    </linearGradient>
    <linearGradient id="wing-r" x1="52" y1="10" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#818CF8" />
      <stop offset="65%" stopColor="#4F46E5" />
      <stop offset="100%" stopColor="#312E81" />
    </linearGradient>
    <linearGradient id="blade" x1="32" y1="6" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="35%" stopColor="#BAE6FD" />
      <stop offset="75%" stopColor="#38BDF8" />
      <stop offset="100%" stopColor="#0284C7" />
    </linearGradient>
    <linearGradient id="spark" x1="22" y1="18" x2="42" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#67E8F9" />
    </linearGradient>
    <linearGradient id="orbit" x1="8" y1="32" x2="56" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#22D3EE" stopOpacity="0.9" />
      <stop offset="50%" stopColor="#818CF8" stopOpacity="0.3" />
      <stop offset="100%" stopColor="#C084FC" stopOpacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2" />

  <!-- Orbital Trajectory Ring -->
  <ellipse cx="32" cy="32" rx="27" ry="13" transform="rotate(-25 32 32)" stroke="url(#orbit)" stroke-width="2.5" stroke-dasharray="4 4" opacity="0.9" />

  <!-- Left Main Wing -->
  <path d="M 32 11 L 10 43 Q 21 40 32 36 Z" fill="url(#wing-l)" filter="url(#glow)" />

  <!-- Right Main Wing -->
  <path d="M 32 11 L 54 43 Q 43 40 32 36 Z" fill="url(#wing-r)" filter="url(#glow)" />

  <!-- Left Stabilizer -->
  <path d="M 19 42 L 13 53 L 26 45 Z" fill="#0284C7" opacity="0.95" />

  <!-- Right Stabilizer -->
  <path d="M 45 42 L 51 53 L 38 45 Z" fill="#4338CA" opacity="0.95" />

  <!-- Central Supersonic Blade -->
  <path d="M 32 7 L 36 26 L 32 52 L 28 26 Z" fill="url(#blade)" />

  <!-- AI Diamond Spark Core -->
  <path d="M 32 19 Q 32 26 39 26 Q 32 26 32 33 Q 32 26 25 26 Q 32 26 32 19 Z" fill="url(#spark)" />

  <!-- Core Radiant Quantum Node -->
  <circle cx="32" cy="26" r="2.5" fill="#FFFFFF" />
</svg>